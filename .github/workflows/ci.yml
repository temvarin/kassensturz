name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per branch at a time: a newer push cancels the run still going, so an older commit can never be deployed
# after a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and publish
    runs-on: ubuntu-latest
    # A throwaway SQL Server for the tests of the database code; it exists only while this job runs.
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Test-only-container-1
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Test-only-container-1 -Q 'SELECT 1'"
          --health-interval 10s --health-retries 12
    env:
      GELD_TEST_SQL: Server=localhost;User ID=sa;Password=Test-only-container-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Relinks the WebAssembly runtime without culture data (InvariantGlobalization in Geld.App.csproj).
      - run: dotnet workload install wasm-tools
      - run: dotnet test
      # The server, with the Blazor app in its wwwroot.
      - run: dotnet publish src/Geld.Server -c Release -o publish
      # Exactly what was tested is what gets deployed. Kept for 90 days: re-running the deploy job of an earlier run
      # puts that version back (see README, Deployment).
      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: publish

  deploy:
    name: Deploy and check
    needs: test
    # Pull requests are tested but never deployed: there is only one environment.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets this job, and only this one, ask GitHub for a short-lived token that Azure trusts (OIDC): no Azure
      # password is stored here. Azure only accepts tokens for pushes to main (the federated credential in Entra ID).
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app
          path: publish
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish
          # The publish folder also holds the Blazor app's runtimeconfig.json, so App Service can't tell which
          # program to start on its own.
          startup-command: dotnet Geld.Server.dll
      # The live app answers with this version, the start page and a deep link work, and the API wants a sign-in.
      - name: Check the live app
        env:
          URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          # The service worker's list of files carries a version derived from all of them.
          expected=$(grep -o '"version": "[^"]*"' publish/wwwroot/service-worker-assets.js)
          for attempt in $(seq 1 12); do # the app restarts after a deploy; a cold start takes up to about a minute
            actual=$(curl -fsS "$URL/service-worker-assets.js" | grep -o '"version": "[^"]*"') && [ "$actual" = "$expected" ] && break
            sleep 10
          done
          echo "deployed: $actual, expected: $expected"
          [ "$actual" = "$expected" ]
          page=$(curl -fsS "$URL/budget")
          grep -q '<title>Kassensturz' <<< "$page"
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/whoami")" = 401 ]
