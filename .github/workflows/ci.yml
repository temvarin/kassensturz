name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Test, publish and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job ask GitHub for a short-lived token that Azure trusts (OIDC): no Azure password is stored here.
      # Azure only accepts tokens for pushes to main (the federated credential in docs/cloud-setup.md).
      id-token: write
    # A throwaway SQL Server for the tests of the database code; it exists only while this job runs.
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Test-only-container-1
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Test-only-container-1 -Q 'SELECT 1'"
          --health-interval 10s --health-retries 12
    env:
      GELD_TEST_SQL: Server=localhost;User ID=sa;Password=Test-only-container-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Relinks the WebAssembly runtime without culture data (InvariantGlobalization in Geld.App.csproj).
      - run: dotnet workload install wasm-tools
      - run: dotnet test
      # The server, with the Blazor app in its wwwroot.
      - run: dotnet publish src/Geld.Server -c Release -o publish
      # Pull requests are tested but never deployed: there is only one environment.
      - if: github.event_name == 'push'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - if: github.event_name == 'push'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish
          # The publish folder also holds the Blazor app's runtimeconfig.json, so App Service can't tell which
          # program to start on its own.
          startup-command: dotnet Geld.Server.dll
